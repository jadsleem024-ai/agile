# JVM args are intentionally NOT set here. This machine needs a custom
# trustStore (see ~/.gradle/gradle.properties) and that path is machine
# specific — a project-level org.gradle.jvmargs would override the user-level
# one entirely and point every other machine at a file that does not exist,
# breaking TLS for them. Keep per-machine JVM settings in the user file.
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
