name: coach_panel
description: Coach admin panel - trainees, programs, and progress tracking.
publish_to: 'none'
version: 1.7.1+12

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  youtube_player_flutter: ^9.0.3
  # Backend
  supabase_flutter: ^2.5.6

  # Push notifications (coach alert when a trainee finishes their block)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # UI helpers
  intl: ^0.19.0
  uuid: ^4.4.0

  # Trainee app: persistence, audio cues, background rest-timer alerts
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/beep.wav
    - assets/sounds/modern_ding.mp3
    - assets/sounds/sweet_text.mp3
    - assets/icon/app_icon.png
    - assets/images/banner.png


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
